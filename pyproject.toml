[project]
name = "opc"
version = "0.5.0"
description = "OPC — 个人智能工具中枢：把看到、听到、学到的一切归集、提炼、建链。"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6",
  "Jinja2>=3.1",
  "lxml>=5",
  "pypdf>=4",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
opc = "opc.cli:main"
opc-mcp = "opc.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opc*"]

[tool.setuptools.package-data]
"opc.hub" = ["static/*"]
