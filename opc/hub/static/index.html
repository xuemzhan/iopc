<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0a0c10" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>OPC · 第二大脑</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#11141b; --panel2:#161a23; --line:#242b37;
    --fg:#e6edf7; --dim:#8b97a8; --accent:#5eead4; --accent2:#7aa2ff;
    --warn:#fbbf24; --bad:#f87171; --ok:#4ade80;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 80% -10%,#12202b 0%,transparent 60%),var(--bg);
    color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:rgba(10,12,16,.8);backdrop-filter:blur(8px);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.5px}
  .brand b{font-size:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11px;color:var(--dim);font-weight:400}
  .pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .pill{display:flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:11px;color:var(--dim);background:var(--panel);cursor:default}
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--dim);box-shadow:0 0 6px currentColor}
  .pill.ok i{background:var(--ok);color:var(--ok)}
  .pill.bad i{background:var(--bad);color:var(--bad)}
  .stats{font:12px var(--mono);color:var(--dim);display:flex;gap:12px}
  .stats b{color:var(--accent);font-weight:600}
  main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
  @media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}}
  .chat{display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .msg{max-width:min(820px,92%);animation:in .22s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#1b2a3a,#16202e);border:1px solid #26384d;border-radius:14px 14px 4px 14px;padding:10px 14px}
  .msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 15px}
  .msg.sys{align-self:center;font-size:12px;color:var(--dim);background:transparent;border:1px dashed var(--line);border-radius:99px;padding:3px 12px}
  .msg .who{font-size:10px;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
  .msg pre,.msg code{font-family:var(--mono);font-size:12.5px}
  .msg pre{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
  .wikilink{color:var(--accent2);border-bottom:1px dotted currentColor}
  .cites{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
  .cites a{color:var(--dim);font-size:12px;text-decoration:none}
  .cites a:hover{color:var(--accent)}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;padding:1px 8px;border-radius:99px;background:#1b2431;color:#9fb2c9;border:1px solid #263244}
  .composer{padding:12px 18px 16px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--bg))}
  .hints{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .hint{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;background:var(--panel)}
  .hint:hover{color:var(--accent);border-color:#2f5b54}
  .inputrow{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;transition:border-color .15s}
  .inputrow:focus-within{border-color:#2f5b54;box-shadow:0 0 0 3px #5eead410}
  textarea{flex:1;resize:none;background:transparent;border:0;color:var(--fg);font:14px/1.6 inherit;outline:none;max-height:180px;min-height:26px;padding:4px}
  .modes{display:flex;gap:2px;background:#0b0e13;border-radius:8px;padding:2px}
  .mode{font-size:11px;padding:4px 9px;border-radius:6px;color:var(--dim);cursor:pointer;border:0;background:transparent}
  .mode.on{background:#1d2a38;color:var(--accent)}
  .mode.rec{background:#3b1d1d;color:#f87171;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  button.send{background:linear-gradient(135deg,var(--accent),#38bdf8);color:#06231f;border:0;border-radius:9px;width:38px;height:34px;font-size:15px;cursor:pointer;font-weight:700}
  button.send:disabled{opacity:.4;cursor:default}
  aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0c0f14}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:9px;text-align:center;font-size:12px;color:var(--dim);cursor:pointer;border:0;background:transparent}
  .tab.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .pane{flex:1;overflow:auto;padding:12px;display:none}
  .pane.on{display:block}
  .tool{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--panel)}
  .tool .hd{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .tool .dt{font-size:11px;color:var(--dim);margin-top:3px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .dot.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}
  canvas{width:100%;height:100%;display:block;border-radius:8px;background:radial-gradient(600px 300px at 50% 40%,#101822 0%,#0a0d12 70%)}
  .src{border-bottom:1px solid #1b212b;padding:8px 2px;font-size:12px}
  .src .t{color:#cfe0f3}
  .src .m{color:var(--dim);font-size:11px;margin-top:2px}
  .foot{padding:8px 12px;border-top:1px solid var(--line);font:11px var(--mono);color:#5b6675;display:flex;justify-content:space-between}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid #2b3a48;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
  .cite{border:0;background:transparent;color:var(--dim);font-size:12px;text-align:left;cursor:pointer;padding:2px 0}
  .cite:hover{color:var(--accent);text-decoration:underline}
  /* 笔记预览 */
  #modal{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(3px);display:none;z-index:50;align-items:center;justify-content:center}
  #modal.on{display:flex}
  .sheet{width:min(860px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .sheet header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .sheet header .t{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet header .m{font:11px var(--mono);color:var(--dim)}
  .sheet .x{border:0;background:transparent;color:var(--dim);font-size:18px;cursor:pointer}
  .sheet .doc{overflow:auto;padding:18px 22px;line-height:1.85;font-size:13.5px}
  .sheet .doc h1,.sheet .doc h2,.sheet .doc h3{font-size:15px;margin:14px 0 6px;color:var(--accent)}
  .sheet .doc pre{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
  .sheet .doc blockquote{border-left:3px solid #2f5b54;margin:8px 0;padding:4px 10px;color:#9fb2c9;background:#0e1a18}
  .sheet footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .btn{background:#1d2a38;color:var(--accent);border:1px solid #2c4356;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  /* 命令补全 */
  #cmds{position:absolute;bottom:112px;left:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;z-index:20;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #cmds.on{display:block}
  #cmds div{padding:5px 9px;border-radius:6px;font-size:12.5px;color:var(--dim);cursor:pointer}
  #cmds div b{color:var(--accent);font-weight:600;margin-right:8px}
  #cmds div:hover,#cmds div.sel{background:#1a2230;color:var(--fg)}
  .bar{height:6px;background:#141a23;border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .stage{font-size:11.5px;color:var(--dim)}
  .conv{padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .conv:hover{background:#141a23}
  .conv.on{background:#141f2b;border-color:#27405a}
  .conv .t{font-size:12.5px;color:#d7e3f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .m{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>OPC</b><span>第二大脑 · 一个入口调度全部工具</span></div>
  <div class="pills" id="pills"></div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="chat">
    <div id="log"></div>
    <form class="composer" id="composer">
      <div class="hints">
        <span class="hint" data-act="meetings">⏱ 导入会议</span>
        <span class="hint" data-act="sync">📥 扫目录</span>
        <span class="hint" data-act="harvest">🧲 回收 AI 会话</span>
        <span class="hint" data-act="digest">🌙 日报</span>
        <span class="hint" data-act="actions">✅ 行动项</span>
        <span class="hint" data-act="lint">🩺 体检</span>
        <span class="hint" data-act="graph">🕸 看图谱</span>
        <span class="hint" data-act="reset">✳ 新对话</span>
        <span class="hint" data-act="help">? 指令</span>
      </div>
      <div class="inputrow">
        <div class="modes" id="modes">
          <button type="button" class="mode on" data-mode="auto">自动</button>
          <button type="button" class="mode" data-mode="capture">记</button>
          <button type="button" class="mode" data-mode="ask">问</button>
          <button type="button" class="mode" id="mic" title="点一下开始录音，再点一下结束">🎙</button>
        </div>
        <textarea id="input" rows="1" placeholder="说点什么：一段想法、一个网址、一个问题，或 / 开头下指令"></textarea>
        <button class="send" id="send" title="发送 (Ctrl+Enter)">↑</button>
      </div>
    </form>
  </section>

  <aside>
    <div class="tabs">
      <button class="tab on" data-tab="tools">工具栈</button>
      <button class="tab" data-tab="graph">图谱</button>
      <button class="tab" data-tab="conv">对话</button>
      <button class="tab" data-tab="sources">来源</button>
    </div>
    <div class="pane on" id="pane-tools"></div>
    <div class="pane" id="pane-graph"><canvas id="canvas"></canvas></div>
    <div class="pane" id="pane-conv"></div>
    <div class="pane" id="pane-sources"></div>
    <div class="foot"><span id="foot-l">—</span><span id="foot-r">v0.1</span></div>
  </aside>
</main>

<div id="modal">
  <div class="sheet">
    <header>
      <div class="t" id="modal-title">笔记</div>
      <div class="m" id="modal-meta"></div>
      <button class="x" id="modal-close">×</button>
    </header>
    <div class="doc" id="modal-body"></div>
    <footer>
      <button class="btn" id="modal-open">在 Obsidian 打开</button>
      <button class="btn" id="modal-ask">就这条继续问</button>
    </footer>
  </div>
</div>
<div id="cmds"></div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
const $ = (s, r = document) => r.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");
let mode = "auto";
let busy = false;

/* ---------------- 基础 ---------------- */
const TOKEN_KEY = "opc_token";
const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
(function adoptToken() {
  const u = new URL(location.href).searchParams.get("token");
  if (u) {
    localStorage.setItem(TOKEN_KEY, u);
    history.replaceState({}, "", location.pathname + location.hash);
  }
})();
function authHeaders(extra) {
  const t = getToken();
  return t ? Object.assign({}, extra, { "X-OPC-Token": t }) : (extra || {});
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function md(s) {
  let h = esc(s);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c.trim()}</pre>`);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '<span class="wikilink">$2</span>');
  h = h.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">$1</span>');
  h = h.replace(/(^|\n)### (.+)/g, "$1<b>$2</b>");
  h = h.replace(/(^|\n)## (.+)/g, "$1<b>$2</b>");
  h = h.replace(/\n/g, "<br>");
  return h;
}

function addMsg(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = (role === "sys" ? "" : `<div class="who">${role === "user" ? "你" : "OPC"}</div>`) + html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
const sys = (t) => addMsg("sys", md(t));
const ai = (t = "") => addMsg("ai", t);
const user = (t) => addMsg("user", md(t));

async function api(path, opts = {}) {
  const headers = authHeaders({ "Content-Type": "application/json" });
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) {
    const t = prompt("需要访问令牌：在电脑上运行 python -m opc token 后粘贴进来");
    if (t) { localStorage.setItem(TOKEN_KEY, t.trim()); location.reload(); }
    throw new Error("需要访问令牌");
  }
  const txt = await r.text();
  let data; try { data = JSON.parse(txt); } catch { data = txt; }
  if (!r.ok) throw new Error((data && data.detail) || r.statusText);
  return data;
}

/* ---------------- 状态 ---------------- */
async function loadStatus() {
  try {
    const s = await api("/api/status");
    const pills = s.tools.map((t) => {
      const cls = t.ok ? "ok" : "bad";
      return `<span class="pill ${cls}" title="${esc(t.detail)}"><i></i>${esc(t.name)}</span>`;
    }).join("");
    $("#pills").innerHTML = pills;
    const st = s.stats;
    $("#stats").innerHTML =
      `<span>来源 <b>${st.sources}</b></span><span>实体 <b>${st.entities}</b></span>` +
      `<span>概念 <b>${st.concepts}</b></span><span>关系 <b>${st.edges}</b></span>`;
    $("#pane-tools").innerHTML = s.tools.map((t) => `
      <div class="tool">
        <div class="hd"><span><span class="dot ${t.ok ? "ok" : "bad"}"></span>${esc(t.name)}</span>
          <span style="color:var(--dim);font-size:10px">${esc(t.kind)}</span></div>
        <div class="dt">${esc(t.detail)}</div>
        ${t.capabilities?.length ? `<div class="tags">${t.capabilities.map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div>` : ""}
      </div>`).join("");
    $("#foot-l").textContent = `${s.tools.filter((t) => t.ok).length}/${s.tools.length} 工具在线`;
    try {
      const w = await api("/api/watch");
      $("#foot-r").textContent = w.running ? `值守 ${w.runs} 轮` : "值守未启动";
    } catch { $("#foot-r").textContent = "v0.1"; }
    return s;
  } catch (e) {
    $("#pills").innerHTML = `<span class="pill bad"><i></i>中枢离线</span>`;
    return null;
  }
}

/* ---------------- 动作 ---------------- */
async function doCapture(text) {
  const el = ai(`<div class="body"><span class="spin"></span>提交任务…</div>`);
  const body = el.querySelector(".body");
  try {
    const r = await api("/api/capture?background=true", {
      method: "POST", body: JSON.stringify({ text }),
    });
    if (!r.job_id) throw new Error("任务提交失败");
    let job = null;
    for (let i = 0; i < 200; i++) {
      await new Promise((res) => setTimeout(res, 1200));
      job = await api("/api/jobs/" + r.job_id);
      const pct = Math.max(2, job.progress || 0);
      body.innerHTML = `<div class="bar"><span style="width:${pct}%"></span></div>
        <div class="stage">${esc(job.stage || "排队中")} · ${pct}%</div>`;
      if (job.status === "done" || job.status === "failed") break;
    }
    if (!job || job.status === "failed") {
      body.innerHTML = `<span style="color:var(--bad)">失败：${esc((job && job.error) || "未知错误")}</span>`;
      return;
    }
    el.innerHTML = resultCard(job.result || {});
    loadStatus(); refreshSources(); loadConversations();
  } catch (e) {
    body.innerHTML = `<span style="color:var(--bad)">失败：${esc(e.message)}</span>`;
  }
}

async function loadConversations() {
  const box = $("#pane-conv");
  if (!box) return;
  try {
    const r = await api("/api/conversations?limit=40");
    const items = r.items || [];
    box.innerHTML = items.map((c) => `
      <div class="conv ${c.id === convId ? "on" : ""}" data-id="${c.id}">
        <div class="t">${esc(c.title || "未命名")}</div>
        <div class="m">${c.n} 条 · ${esc(String(c.last || "").slice(0, 40))}</div>
      </div>`).join("") || "<i>还没有会话</i>";
    box.querySelectorAll(".conv").forEach((el) => {
      el.onclick = () => openConversation(el.dataset.id);
    });
  } catch (e) {
    box.innerHTML = `<i>${esc(e.message)}</i>`;
  }
}

async function openConversation(id) {
  try {
    const c = await api("/api/conversations/" + id);
    convId = c.id;
    thread = [];
    lastCites = [];
    log.innerHTML = "";
    for (const m of c.messages) {
      if (m.role === "user") {
        user(m.content);
        thread.push({ role: "user", content: m.content });
      } else {
        ai(md(m.content) + citesHtml(m.citations || []));
        thread.push({ role: "assistant", content: m.content });
      }
    }
    sys(`已载入会话「${esc(c.title || "")}」，可以继续追问`);
    loadConversations();
  } catch (e) {
    sys("载入失败：" + e.message);
  }
}

function resultCard(r) {
  const ents = (r.entities || []).map((e) => `<span class="tag">${esc(e.name)}</span>`).join("");
  const cons = (r.concepts || []).map((c) => `<span class="tag" style="background:#1a2333;color:#9ec1ff">${esc(c.name)}</span>`).join("");
  const kp = (r.key_points || []).map((p) => `<div>· ${esc(p)}</div>`).join("");
  return `${md(r.summary || "")}
    ${kp ? `<div class="card"><h4>要点</h4>${kp}</div>` : ""}
    <div class="card"><h4>${esc(r.title || "")}</h4>
      <div style="font-size:12px;color:var(--dim)">${esc(r.path || "")}${r.actions?.length ? ` · 行动项 ${r.actions.length} 条` : ""}</div>
      <div class="tags">${ents}${cons}</div>
    </div>`;
}

let thread = [];
let lastCites = [];
let convId = null;

function citesHtml(cites) {
  if (!cites || !cites.length) return "";
  return `<div class="cites">` + cites.map((c) =>
    `<button class="cite" data-c="${encodeURIComponent(JSON.stringify(c))}">[${c.n}] ${esc(c.title)}</button>`).join("") + `</div>`;
}

function parseCite(el) {
  try { return JSON.parse(decodeURIComponent(el.dataset.c)); } catch { return null; }
}

async function doAsk(q) {
  const el = ai(`<div class="body"></div>`);
  const body = el.querySelector(".body");
  body.innerHTML = `<span class="spin"></span>检索知识库…`;
  let text = "";
  const history = thread.slice(-6);
  try {
    const res = await fetch("/api/ask/stream", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ question: q, history, conversation_id: convId }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop() || "";
      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        let d;
        try { d = JSON.parse(line.slice(6)); } catch { continue; }
        if (d.type === "delta") {
          text += d.text;
          body.innerHTML = md(text);
          log.scrollTop = log.scrollHeight;
        } else if (d.type === "error") {
          body.innerHTML += `<div style="color:var(--bad)">${esc(d.text)}</div>`;
        } else if (d.type === "conversation") {
          convId = d.id;
        } else if (d.type === "done") {
          lastCites = d.citations || [];
          body.innerHTML = md(text) + citesHtml(lastCites);
        }
      }
    }
    if (!text) body.innerHTML = `<span style="color:var(--bad)">没有返回内容</span>`;
    else {
      thread.push({ role: "user", content: q });
      thread.push({ role: "assistant", content: text });
    }
  } catch (e) {
    body.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`;
  }
  refreshSources();
  loadConversations();
}

let recorder = null, chunks = [];
async function toggleMic() {
  const btn = $("#mic");
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      btn.classList.remove("rec");
      btn.textContent = "🎙";
      await sendVoice(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
    };
    recorder.start();
    btn.classList.add("rec");
    btn.textContent = "■";
    sys("录音中…再点一下结束（最长 60 秒）");
    setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 60000);
  } catch (e) {
    sys("无法访问麦克风：" + e.message);
  }
}

async function sendVoice(blob) {
  const el = ai(`<div class="body"><span class="spin"></span>上传录音…</div>`);
  const body = el.querySelector(".body");
  try {
    const fd = new FormData();
    fd.append("file", blob, "voice.webm");
    const r = await fetch("/api/voice", { method: "POST", headers: authHeaders({}), body: fd });
    if (r.status === 401) { body.innerHTML = "需要访问令牌"; return; }
    const job = await r.json();
    let st = null;
    for (let i = 0; i < 150; i++) {
      await new Promise((res) => setTimeout(res, 1200));
      st = await api("/api/jobs/" + job.job_id);
      const pct = Math.max(2, st.progress || 0);
      body.innerHTML = `<div class="bar"><span style="width:${pct}%"></span></div>
        <div class="stage">${esc(st.stage || "排队中")} · ${pct}%</div>`;
      if (st.status === "done" || st.status === "failed") break;
    }
    if (!st || st.status === "failed") {
      body.innerHTML = `<span style="color:var(--bad)">失败：${esc((st && st.error) || "未知错误")}</span>`;
      return;
    }
    const res = st.result || {};
    el.innerHTML = md("**转写**\\n\\n" + (res.transcript || "")) + resultCard(res);
    loadStatus(); refreshSources();
  } catch (e) {
    body.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`;
  }
}

let sim = null;
async function drawGraph() {
  const cv = $("#canvas");
  if (!cv) return;
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let g;
  try { g = await api("/api/graph?limit=140"); } catch { return; }
  const W = rect.width, H = rect.height, pad = 30;

  // 只画有连接的节点：孤点在图里没有信息量，还会把布局撑乱
  const deg = new Map();
  for (const l of g.links) {
    deg.set(l.source, (deg.get(l.source) || 0) + 1);
    deg.set(l.target, (deg.get(l.target) || 0) + 1);
  }
  let keep = g.nodes.filter((n) => (deg.get(n.id) || 0) > 0);
  keep.sort((a, b) => (deg.get(b.id) || 0) - (deg.get(a.id) || 0));
  keep = keep.slice(0, 110);
  const rawIds = new Set(keep.map((n) => n.id));
  const links = g.links.filter((l) => rawIds.has(l.source) && rawIds.has(l.target));
  const R = Math.min(W, H) * 0.22;
  const nodes = keep.map((n, i) => ({
    ...n, degree: deg.get(n.id) || 0,
    x: W / 2 + Math.cos((i / Math.max(keep.length, 1)) * 6.283) * R + (Math.random() - .5) * 8,
    y: H / 2 + Math.sin((i / Math.max(keep.length, 1)) * 6.283) * R + (Math.random() - .5) * 8,
    dx: 0, dy: 0,
  }));
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const color = (gr) => gr === "entity" ? "#5eead4" : gr === "concept" ? "#7aa2ff" : "#94a3b8";
  const k = Math.sqrt((W * H) / Math.max(nodes.length, 1)) * 0.95;
  let temp = Math.min(W, H) / 7, tick = 0, raf = 0;

  function frame() {
    tick++;
    for (const n of nodes) { n.dx = 0; n.dy = 0; }
    // 斥力（Fruchterman-Reingold）
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy;
        if (d2 > (k * 2.6) ** 2) continue;
        let d = Math.sqrt(d2) || 0.01;
        const f = (k * k) / d;
        dx /= d; dy /= d;
        a.dx += dx * f; a.dy += dy * f;
        b.dx -= dx * f; b.dy -= dy * f;
      }
    }
    // 引力
    for (const l of links) {
      const a = byId.get(l.source), b = byId.get(l.target);
      if (!a || !b) continue;
      let dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d * d) / k * 0.9;
      dx /= d; dy /= d;
      a.dx -= dx * f; a.dy -= dy * f;
      b.dx += dx * f; b.dy += dy * f;
    }
    for (const n of nodes) {
      // 向心力，避免整体飘散
      n.dx += (W / 2 - n.x) * 0.02;
      n.dy += (H / 2 - n.y) * 0.02;
      const len = Math.hypot(n.dx, n.dy) || 1;
      const step = Math.min(len, temp);
      n.x += (n.dx / len) * step;
      n.y += (n.dy / len) * step;
      n.x = Math.max(pad, Math.min(W - pad, n.x));
      n.y = Math.max(pad, Math.min(H - pad, n.y));
    }
    temp *= 0.975;

    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    for (const l of links) {
      const a = byId.get(l.source), b = byId.get(l.target);
      ctx.strokeStyle = l.rel === "co_occurs" ? "rgba(94,234,212,.10)" : "rgba(122,162,255,.16)";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const n of nodes) {
      const r = n.group === "concept" ? 3.4 : n.group === "entity" ? 4.6 : 5.4;
      ctx.beginPath(); ctx.arc(n.x, n.y, r + Math.min(3, n.degree / 12), 0, 7);
      ctx.fillStyle = color(n.group); ctx.globalAlpha = .92; ctx.fill(); ctx.globalAlpha = 1;
    }
    for (const n of nodes) {
      if (n.degree < 10) continue;
      ctx.fillStyle = "rgba(226,236,248,.62)";
      ctx.font = "9.5px -apple-system,Segoe UI,Microsoft YaHei,sans-serif";
      ctx.fillText(String(n.label).slice(0, 14), n.x + 7, n.y + 3);
    }
    if (tick < 700 && temp > 0.7) raf = requestAnimationFrame(frame);
  }
  cancelAnimationFrame(sim); frame();
  cv.onclick = (e) => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 12;
    for (const n of nodes) { const d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; best = n; } }
    if (best) sys(`${best.label}（${best.group} · 连接 ${best.degree}）`);
  };
}

/* ---------------- 路由 ---------------- */
const COMMANDS = {
  "/ask": (q) => doAsk(q || "最近的知识库讲了什么"),
  "/note": (q) => doCapture(q),
  "/meeting": () => doMeetings(),
  "/sync": () => doSync(),
  "/harvest": () => doHarvest(),
  "/graph": () => { location.hash = "#graph"; switchTab("graph"); drawGraph(); },
  "/topic": (q) => doSynthesize(q),
  "/help": () => sys(`指令：/ask 问题 · /note 内容 · /topic 主题（跨来源综述） · /meeting 会议列表 · /sync 扫目录 · /harvest 回收 AI 会话 · /graph 图谱。直接说话会自动判断「记」还是「问」。`),
};

function looksQuestion(t) {
  if (/[?？]\s*$/.test(t)) return true;
  if (t.length <= 70 && /(什么|为什么|怎么|如何|哪些|哪个|谁|多少|是不是|有没有|能否|吗)\s*[?？]?$/.test(t)) return true;
  if (t.length <= 40 && /^(什么|为什么|怎么|如何|哪些|哪个|谁|多少|是不是|有没有)/.test(t)) return true;
  return false;
}

function route(text) {
  const t = text.trim();
  if (!t) return;
  user(t);
  const cmd = t.split(/\s+/)[0];
  if (COMMANDS[cmd]) {
    const rest = t.slice(cmd.length).trim();
    if (cmd === "/meeting" && /^\d+$/.test(rest)) return ingestMeeting(Number(rest), { textContent: "", disabled: false });
    if (cmd === "/graph") { COMMANDS[cmd](rest); return; }
    return COMMANDS[cmd](rest);
  }
  if (mode === "ask") return doAsk(t);
  if (mode === "capture") return doCapture(t);
  if (/^https?:\/\//.test(t)) { return doIngestUrl(t); }
  if (looksQuestion(t)) return doAsk(t);
  return doCapture(t);
}

  const el = ai(`<span class="spin"></span>抓取网页…`);
  try { const r = await api("/api/ingest", { method: "POST", body: JSON.stringify({ target: url }) }); el.innerHTML = resultCard(r); loadStatus(); }
  catch (e) { el.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}

  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
window.ingestMeeting = ingestMeeting;

/* ---------------- 启动 ---------------- */
const EXAMPLES = [
  ["📝 记一条", "今天想清楚了一件事：知识库的复利来自链接密度，不是笔记数量。"],
  ["❓ 问库", "最近这场会讲了什么？"],
  ["⏱ 导会议", "/meeting"],
  ["🕸 看图谱", "/graph"],
];
function welcome() {
  const el = ai(`
    <div style="font-size:15.5px;line-height:1.5;margin-bottom:8px">
      把<b style="color:var(--accent)">看到的、听到的、学到的</b>，都变成一张互相连接的知识网。
    </div>
    <div style="color:var(--dim);font-size:12.5px;line-height:1.75">
      说一句话，我自动判断该「记」还是该「问」；记下的内容会提炼成实体/概念/主张，写进 Obsidian 并建立双向链接。
    </div>
    <div class="tags" style="margin-top:12px">
      ${EXAMPLES.map(([label, text], i) => `<button class="hint ex" data-i="${i}" style="cursor:pointer;font-size:11.5px">${label}</button>`).join("")}
    </div>`);
  el.querySelectorAll(".ex").forEach((b) => b.onclick = () => {
    const t = EXAMPLES[Number(b.dataset.i)][1];
    input.value = t; input.focus();
    $("#composer").requestSubmit();
  });
}

(async function boot() {
  welcome();
  await loadStatus();
  refreshSources();
  setInterval(loadStatus, 30000);
  const q = new URLSearchParams(location.search).get("q");
  if (q) setTimeout(() => {
    mode = "ask";
    document.querySelectorAll(".mode[data-mode]").forEach((x) => x.classList.toggle("on", x.dataset.mode === "ask"));
    input.value = q;
    $("#composer").requestSubmit();
  }, 400);
})();
</script>
</body>
</html>
