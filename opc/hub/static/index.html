<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="OPC —— 本地优先的第二大脑：记下、提炼、建链、问答。" />
<meta name="theme-color" content="#0a0c10" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>OPC · 第二大脑</title>

</head>
<body>

  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10z"/><path d="m13.5 7 3.5 3.5"/></symbol>

  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18z"/><path d="M12 9v5M12 17v.1"/></symbol>

  <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>

  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M11 8v6M8 11h6M16 16l4.5 4.5"/></symbol>

  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M4 9a12 12 0 0 1 16 0M7 12.5a8 8 0 0 1 10 0M10 16a3.5 3.5 0 0 1 4 0M12 19h.1"/></symbol>

<header class="top">
  <a class="brand" href="/" title="OPC 首页">
    <img src="/static/logo.svg" alt="" width="28" height="28" />
    <span class="brand-text">OPC<em>第二大脑</em></span>
  </a>
  <div class="grow"></div>
  <button class="pill-btn" id="attentionBtn" title="待处理" data-track="open_inbox">
    <svg class="i"><use href="#i-inbox"/></svg>
    <span class="pill-label">待处理</span>
    <b class="badge" id="attentionCount" hidden>0</b>
  </button>
  <button class="pill-btn" id="searchBtn" title="搜索知识库 (Ctrl/⌘ K)" data-track="open_search">
    <svg class="i"><use href="#i-search"/></svg>
    <span class="pill-label">搜索</span>
    <kbd class="kbd-hide">⌘K</kbd>
  </button>
  <button class="icon-btn" id="settingsBtn" title="设置与连接器" aria-label="设置" data-track="open_settings">
    <svg class="i"><use href="#i-settings"/></svg>
  </button>
  <button class="icon-btn" id="drawerBtn" title="打开侧栏" aria-label="打开侧栏" data-track="open_drawer">
    <svg class="i"><use href="#i-panel"/></svg>
  </button>
</header>

<main class="stage">
  <div id="thread" aria-live="polite" aria-relevant="additions text"></div>

  <div id="stopBar" class="stop-bar" hidden>
    <span class="spin"></span><span id="stopText">正在生成回答…</span>
    <button type="button" class="btn ghost" id="stopBtn">停止</button>
  </div>

  <div id="taskStrip" class="task-strip" hidden></div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="intent-row" id="intentRow" role="tablist" aria-label="输入意图">
      <button type="button" class="intent" data-intent="auto" role="tab" aria-selected="true" data-track="intent" data-id="auto">自动</button>
      <button type="button" class="intent" data-intent="note" role="tab" aria-selected="false" data-track="intent" data-id="note">记</button>
      <button type="button" class="intent" data-intent="ask" role="tab" aria-selected="false" data-track="intent" data-id="ask">问</button>
      <button type="button" class="intent" data-intent="do" role="tab" aria-selected="false" data-track="intent" data-id="do">做</button>
      <span class="intent-spacer"></span>
      <span class="route-hint" id="routeHint">自动判断「记」或「问」</span>
    </div>
    <div class="field" id="field">
      <textarea id="input" rows="1" placeholder="说点什么，或按 / 打开命令" enterkeyhint="send"></textarea>
      <div class="field-actions">
        <button type="button" class="icon-btn sm" id="attach" data-track="attach" title="上传文件" aria-label="上传文件">
          <svg class="i"><use href="#i-paperclip"/></svg>
        </button>
        <button type="button" class="icon-btn sm" id="anno" data-track="annotate" title="随手注记（带当前锚点）" aria-label="随手注记">
          <svg class="i"><use href="#i-note"/></svg>
        </button>
        <button type="button" class="icon-btn sm" id="mic" data-track="voice" title="语音输入" aria-label="语音输入">
          <svg class="i"><use href="#i-mic"/></svg>
        </button>
        <button class="send" id="send" data-track="send" title="发送 (Enter)" aria-label="发送">
          <svg class="i"><use href="#i-send"/></svg>
        </button>
      </div>
    </div>
    <div class="hintline">
      <span><kbd>Enter</kbd> 发送<span class="hint-extra"> · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 强制提问</span> · <kbd>/</kbd> 命令</span>
      <span id="pulseLine" class="opt">连接中…</span>
    </div>
  </form>
</main>

<aside class="drawer" id="drawer" aria-label="侧栏">
  <header class="drawer-head">
    <div class="seg" id="seg" role="tablist">
      <button data-pane="conv" class="on" role="tab" data-track="pane" data-id="conv">对话</button>
      <button data-pane="graph" role="tab" data-track="pane" data-id="graph">图谱</button>
      <button data-pane="sources" role="tab" data-track="pane" data-id="sources">来源</button>
      <button data-pane="notes" role="tab" data-track="pane" data-id="notes">注记</button>
      <button data-pane="inbox" role="tab" data-track="pane" data-id="inbox">待办</button>
      <button data-pane="ontology" role="tab" data-track="pane" data-id="ontology">本体</button>
    </div>
    <button class="icon-btn" id="drawerClose" aria-label="关闭侧栏">
      <svg class="i"><use href="#i-x"/></svg>
    </button>
  </header>
  <div class="pane on" id="pane-conv"></div>
  <div class="pane" id="pane-graph">
    <div class="gtools">
      <button data-g="out" title="缩小" aria-label="缩小"><svg class="i"><use href="#i-zoom-out"/></svg></button>
      <button data-g="in" title="放大" aria-label="放大"><svg class="i"><use href="#i-zoom-in"/></svg></button>
      <button data-g="fit" title="适配窗口" aria-label="适配窗口"><svg class="i"><use href="#i-fit"/></svg></button>
      <button data-g="full" title="全屏" aria-label="全屏"><svg class="i"><use href="#i-expand"/></svg></button>
      <button data-g="undo" title="撤销上一步" aria-label="撤销"><svg class="i"><use href="#i-undo"/></svg></button>
      <span class="sep"></span>
      <select id="gmode" title="图谱范围">
        <option value="lite">精简</option>
        <option value="full">全图</option>
      </select>
      <select id="gedge" title="关系类型">
        <option value="all">全部关系</option>
        <option value="evidence">只看证据</option>
        <option value="structure">只看结构</option>
      </select>
      <select id="gfilter" title="节点类型">
        <option value="all">全部节点</option>
        <option value="entity">实体</option>
        <option value="concept">概念</option>
        <option value="source">来源</option>
      </select>
      <span id="gzoom">100%</span>
    </div>
    <canvas id="canvas" tabindex="0" aria-label="知识图谱画布"></canvas>
    <input id="gsearch" placeholder="搜节点" aria-label="搜索节点" />
    <div class="glegend" aria-hidden="true">
      <span><i class="dot entity"></i>实体</span>
      <span><i class="dot concept"></i>概念</span>
      <span><i class="dot source"></i>来源</span>
      <span><i class="line co"></i>共现证据</span>
    </div>
    <div class="gmeta" id="gmeta"></div>
    <div class="gcard" id="gcard" hidden>
      <div class="gcard-head">
        <div class="gcard-title"><span id="gcName"></span><span class="gcard-type" id="gcType"></span></div>
        <button class="icon-btn sm" id="gcClose" aria-label="关闭详情"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="gcard-meta" id="gcMeta"></div>
      <div class="gcard-acts" id="gcActs"></div>
      <div class="gcard-nb" id="gcNb"></div>
    </div>
  </div>
  <div class="pane" id="pane-sources"></div>
  <div class="pane" id="pane-notes"></div>
  <div class="pane" id="pane-inbox"></div>
  <div class="pane" id="pane-ontology"></div>
</aside>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="命令与搜索">
  <div class="palette-box">
    <div class="palette-tabs">
      <button class="ptab on" data-mode="cmd" data-track="palette_tab" data-id="cmd">命令</button>
      <button class="ptab" data-mode="search" data-track="palette_tab" data-id="search">知识库</button>
      <span class="palette-hint" id="paletteHint">↑↓ 选择 · Enter 打开 · Esc 关闭</span>
    </div>
    <input id="paletteInput" placeholder="输入命令，或搜索知识库…" autocomplete="off" />
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet" id="sheet">
    <header class="sheet-head">
      <div class="sheet-title" id="modalTitle">详情</div>
      <div class="sheet-meta" id="modalMeta"></div>
      <button class="icon-btn" id="modalClose" aria-label="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    </header>
    <div class="sheet-body" id="modalBody"></div>
    <footer class="sheet-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="drop-zone" id="dropZone" hidden>
  <div class="drop-card">
    <svg class="i lg"><use href="#i-paperclip"/></svg>
    <b>松手即可入库</b>
    <span>支持 md / txt / pdf / docx / pptx / xlsx</span>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="srLive" class="sr-only" aria-live="polite"></div>
<input type="file" id="fileInput" hidden multiple />

<script src="/static/app.js?v=0.9.9-1" defer></script>
</body>
</html>
